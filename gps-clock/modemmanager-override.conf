# Pull the modem-GPS init monitor up whenever ModemManager starts.
# check-modem.sh stops/starts ModemManager (STK/IMSI check on every boot); the stop
# propagates to sg-mm-gps-init via its Requires= and nothing restarts it otherwise,
# leaving modem GPS disabled and gpsd without a device ("no-dev" in the UI).
[Unit]
Wants=sg-mm-gps-init.service
